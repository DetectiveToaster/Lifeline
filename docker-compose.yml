services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=${DB_URL:-postgresql://lifeline:lifeline@postgres:5432/lifeline}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - lifeline

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DB_URL=${DB_URL:-postgresql://lifeline:lifeline@postgres:5432/lifeline}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifeline

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lifeline

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lifeline
      - POSTGRES_PASSWORD=lifeline
      - POSTGRES_DB=lifeline
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline -d lifeline"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lifeline

volumes:
  pg_data:

networks:
  lifeline:
    driver: bridge
